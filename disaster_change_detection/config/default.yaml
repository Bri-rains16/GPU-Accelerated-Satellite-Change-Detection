project:
  title: "GPU-Accelerated Satellite Image Change Detection"
  author: "Bristi Biswas & [Insert Teammate's Name]" 
  institution: "Jaypee Institute of Information Technology"

paths:
  dataset_dir: "./datasets/xBD_full"
  models_dir: "./models/saved"
  results_dir: "./results"

execution:
  mode: "deep_learning" 
  use_gpu_if_available: true
  num_workers: 8   
  batch_size: 64     
  num_epochs: 50    

dataset:
  disaster_types: ["volcano", "hurricane"] 
  patch_size: 256
  stride: 128      
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15